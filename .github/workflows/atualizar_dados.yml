# Robô do ClimaPonto: baixa os dados mais recentes do INMET uma vez por mês
# e atualiza matematica-dps/dados/inmet_sp.json. O usuário final só baixa esse JSON pequeno.
name: Atualizar dados do INMET

on:
  schedule:
    - cron: "17 9 3 * *"      # dia 3 de cada mês, 06h17 (horário de Brasília)
  workflow_dispatch:           # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths:
      - "matematica-dps/scripts/atualizar_dados.py"
      - ".github/workflows/atualizar_dados.yml"

permissions:
  contents: write              # só o necessário para salvar o JSON no repositório

concurrency:                   # nunca duas atualizações ao mesmo tempo
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar e processar dados do INMET
        run: python matematica-dps/scripts/atualizar_dados.py
      - name: Salvar no repositório (se mudou)
        run: |
          git config user.name "climaponto-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add matematica-dps/dados/inmet_sp.json
          if git diff --cached --quiet; then
            echo "Sem dados novos."
          else
            git commit -m "Atualiza dados do INMET ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
